name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: install
        run: |
          # cpu-only torch wheel, the default one pulls in ~2GB of cuda libraries
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: micrograd
        working-directory: micrograd
        run: python test_engine.py

      - name: tensorgrad
        working-directory: tensorgrad
        run: |
          python test_tensor.py
          python test_layers.py

      - name: manual backprop matches autograd
        working-directory: makemore
        run: python backprop_ninja.py --steps 200
